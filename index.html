<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#314e68"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="application-name"
    content="Nomi"
  >

  <meta
    name="robots"
    content="noindex, nofollow, noarchive"
  >

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-src https://script.google.com https://*.google.com https://*.googleusercontent.com; connect-src 'self' https://*.google.com https://*.googleusercontent.com; worker-src 'self'; manifest-src 'self'; base-uri 'self';"
  >

  <title>Nomi</title>

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./nomi-512.png"
  >

  <style>
    :root {
      color-scheme: light;

      --navy: #344b5e;
      --navy-dark: #293e4f;
      --sage: #789a91;
      --warm: #f4f2ee;
      --blue-soft: #e5ecef;
      --line: #dce3e6;
      --muted: #68747b;
      --danger: #b65f5f;
      --shadow:
        0 22px 70px
        rgba(52, 75, 94, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--warm);
      color: var(--navy);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color:
        transparent;
    }

    button:focus-visible,
    a:focus-visible {
      outline:
        3px solid
        rgba(84, 126, 155, 0.28);
      outline-offset: 3px;
    }

    .app-frame {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--warm);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 0.2s ease;
    }

    body.ready .app-frame {
      opacity: 1;
      visibility: visible;
    }

    .splash,
    .problem,
    .offline {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding:
        max(
          22px,
          env(safe-area-inset-top)
        )
        20px
        max(
          22px,
          env(safe-area-inset-bottom)
        );
      background:
        radial-gradient(
          circle at 78% 0%,
          rgba(229, 236, 239, 0.95),
          transparent 32rem
        ),
        linear-gradient(
          180deg,
          #fbfaf8,
          var(--warm)
        );
    }

    .panel {
      width: min(100%, 440px);
      border:
        1px solid
        rgba(220, 227, 230, 0.95);
      border-radius: 28px;
      padding: 28px;
      background:
        rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 26px;
      background:
        linear-gradient(
          145deg,
          var(--navy),
          var(--navy-dark)
        );
      box-shadow:
        0 16px 36px
        rgba(52, 75, 94, 0.24);
    }

    .logo svg {
      width: 76px;
      height: 76px;
    }

    h1,
    h2 {
      margin: 0;
      color: var(--navy);
      font-weight: 620;
      letter-spacing: -0.045em;
    }

    h1 {
      font-size: 34px;
    }

    h2 {
      font-size: 24px;
    }

    p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 25px auto 0;
      border:
        4px solid
        var(--blue-soft);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: 22px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      border:
        1px solid
        var(--navy);
      border-radius: 14px;
      padding: 10px 14px;
      background: var(--navy);
      color: #fff;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .button.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--navy);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 520px) {
      .panel {
        border-radius: 23px;
        padding: 24px 20px;
      }

      .logo {
        width: 82px;
        height: 82px;
        border-radius: 23px;
      }

      .logo svg {
        width: 68px;
        height: 68px;
      }

      h1 {
        font-size: 31px;
      }
    }
  </style>
</head>

<body>
  <iframe
    id="nomi-frame"
    class="app-frame"
    title="Nomi Reiseplanung"
    referrerpolicy="strict-origin-when-cross-origin"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <div
    id="splash"
    class="splash"
  >
    <div class="panel">
      <div
        class="logo"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 96 96"
          focusable="false"
        >
          <path
            d="M24 70V34c0-12 15-15 21-5l20 34c5 9 18 5 18-5V23"
            fill="none"
            stroke="#ffffff"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>

          <path
            d="M32 61V38"
            fill="none"
            stroke="rgba(255,255,255,.92)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="5 6"
          ></path>

          <circle
            cx="75"
            cy="22"
            r="14"
            fill="#789a91"
          ></circle>

          <path
            d="M68 22l5 5 9-11"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </div>

      <h1>Nomi</h1>

      <p>
        Deine Reise. Perfekt organisiert.
      </p>

      <div
        class="loader"
        aria-label="Nomi wird geladen"
      ></div>
    </div>
  </div>

  <div
    id="problem"
    class="problem"
    hidden
  >
    <div class="panel">
      <div
        class="logo"
        aria-hidden="true"
      >
        <svg
          viewBox="0 0 96 96"
          focusable="false"
        >
          <path
            d="M24 70V34c0-12 15-15 21-5l20 34c5 9 18 5 18-5V23"
            fill="none"
            stroke="#ffffff"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>

          <path
            d="M32 61V38"
            fill="none"
            stroke="rgba(255,255,255,.92)"
            stroke-width="3"
            stroke-linecap="round"
            stroke-dasharray="5 6"
          ></path>

          <circle
            cx="75"
            cy="22"
            r="14"
            fill="#789a91"
          ></circle>

          <path
            d="M68 22l5 5 9-11"
            fill="none"
            stroke="#ffffff"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </div>

      <h2>
        Nomi konnte nicht geladen werden
      </h2>

      <p id="problem-text">
        Öffne Nomi einmal direkt und kehre
        anschließend zu dieser Seite zurück.
      </p>

      <div class="actions">
        <a
          id="open-direct"
          class="button"
          href="https://script.google.com/macros/s/AKfycbxx5jipvmW16yNSonwnSN5yJT_yGrPLpUYsosjufjavyXRI0pLl4Uby9Yb5t7i4o33n/exec"
          target="_blank"
          rel="noopener noreferrer"
        >
          Nomi direkt öffnen
        </a>

        <button
          id="retry"
          class="button secondary"
          type="button"
        >
          Erneut versuchen
        </button>
      </div>
    </div>
  </div>

  <div
    id="offline"
    class="offline"
    hidden
  >
    <div class="panel">
      <h2>
        Keine Internetverbindung
      </h2>

      <p>
        Die Nomi-Daten liegen in Google
        Apps Script und benötigen eine
        Internetverbindung.
      </p>

      <div class="actions">
        <button
          id="offline-retry"
          class="button"
          type="button"
        >
          Verbindung erneut prüfen
        </button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const APP_URL =
        'https://script.google.com/macros/s/AKfycbxx5jipvmW16yNSonwnSN5yJT_yGrPLpUYsosjufjavyXRI0pLl4Uby9Yb5t7i4o33n/exec';

      const frame =
        document.getElementById(
          'nomi-frame'
        );

      const splash =
        document.getElementById(
          'splash'
        );

      const problem =
        document.getElementById(
          'problem'
        );

      const offline =
        document.getElementById(
          'offline'
        );

      let revealTimer = null;
      let problemTimer = null;
      let frameLoaded = false;

      function hide(element) {
        element.hidden = true;
      }

      function show(element) {
        element.hidden = false;
      }

      function clearTimers() {
        window.clearTimeout(
          revealTimer
        );

        window.clearTimeout(
          problemTimer
        );
      }

      function revealFrame() {
        hide(splash);

        document.body.classList.add(
          'ready'
        );
      }

      function showProblem() {
        if (frameLoaded) {
          return;
        }

        hide(splash);
        hide(offline);
        show(problem);
      }

      function loadNomi() {
        clearTimers();

        frameLoaded = false;

        hide(problem);
        hide(offline);
        show(splash);

        document.body.classList.remove(
          'ready'
        );

        if (!navigator.onLine) {
          hide(splash);
          show(offline);
          return;
        }

        const separator =
          APP_URL.includes('?')
            ? '&'
            : '?';

        frame.src =
          APP_URL +
          separator +
          'nomiPwa=1&t=' +
          Date.now();

        revealTimer =
          window.setTimeout(
            revealFrame,
            2500
          );

        problemTimer =
          window.setTimeout(
            showProblem,
            15000
          );
      }

      frame.addEventListener(
        'load',
        function () {
          frameLoaded = true;

          clearTimers();

          hide(splash);
          hide(problem);
          hide(offline);

          document.body.classList.add(
            'ready'
          );
        }
      );

      document
        .getElementById('retry')
        .addEventListener(
          'click',
          loadNomi
        );

      document
        .getElementById(
          'offline-retry'
        )
        .addEventListener(
          'click',
          loadNomi
        );

      window.addEventListener(
        'online',
        loadNomi
      );

      window.addEventListener(
        'offline',
        function () {
          clearTimers();
          hide(splash);
          hide(problem);
          show(offline);
        }
      );

      window.addEventListener(
        'load',
        function () {
          loadNomi();

          if (
            'serviceWorker' in
            navigator
          ) {
            navigator
              .serviceWorker
              .register(
                './sw.js?v=1.0.3',
                {
                  scope: './'
                }
              )
              .catch(
                function (error) {
                  console.warn(
                    'Service Worker konnte nicht registriert werden.',
                    error
                  );
                }
              );
          }
        }
      );
    })();
  </script>
</body>
</html>
