<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#344b5e">
  <meta name="description" content="Nomi – eure einfache Reise-, Pack- und Aufgaben-App.">
  <meta name="robots" content="noindex,nofollow">
  <title>Nomi</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">

  <style>
    :root { --navy:#344b5e; --warm:#f4f2ee; --soft:#e5ecef; --muted:#6f7d84; }
    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; background:var(--warm); }
    body { overflow:hidden; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { position:fixed; inset:0; background:var(--warm); }
    iframe { display:block; width:100%; height:100%; border:0; background:var(--warm); }
    .loading, .error {
      position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:28px;
      background:linear-gradient(180deg,#faf9f6,var(--warm)); color:var(--navy); text-align:center;
    }
    .loading-card, .error-card { width:min(100%,420px); border-radius:24px; padding:28px 22px; background:#fff; box-shadow:0 20px 60px rgba(52,75,94,.12); }
    .mark { display:grid; place-items:center; width:64px; height:64px; margin:0 auto 14px; border-radius:20px; background:var(--navy); color:#fff; }
    .mark svg { width:46px; height:46px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:1.8; }
    h1 { margin:0; font-size:28px; letter-spacing:-.04em; }
    p { margin:8px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
    button { min-height:46px; margin-top:16px; border:0; border-radius:13px; padding:10px 16px; background:var(--navy); color:#fff; font:inherit; font-weight:700; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main class="shell">
    <div class="loading" id="loading">
      <div class="loading-card">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path d="M12 35V16.5c0-5.2 6.8-6.5 9.2-2l10.2 17.4c2.1 3.6 7.6 2.1 7.6-2.1V12"></path>
            <path d="M16.2 30.5V18"></path>
            <circle cx="37" cy="11" r="7"></circle>
            <path d="M33.7 11.1l2.2 2.2 4.2-5"></path>
          </svg>
        </div>
        <h1>Nomi</h1>
        <p>Deine Reise. Perfekt organisiert.</p>
      </div>
    </div>

    <div class="error" id="configError" hidden>
      <div class="error-card">
        <div class="mark">!</div>
        <h1>Nomi ist noch nicht verbunden</h1>
        <p>In <strong>config.js</strong> fehlt die neue Apps-Script-/exec-URL.</p>
      </div>
    </div>

    <iframe id="nomiFrame" title="Nomi" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>

  <script src="./config.js"></script>
  <script>
    (function () {
      'use strict';
      var frame = document.getElementById('nomiFrame');
      var loading = document.getElementById('loading');
      var configError = document.getElementById('configError');
      var url = window.NOMI_CONFIG && window.NOMI_CONFIG.APP_URL;

      if (!url || !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(url)) {
        loading.hidden = true;
        configError.hidden = false;
        return;
      }

      frame.addEventListener('load', function () {
        window.setTimeout(function () { loading.hidden = true; }, 120);
      });

      frame.src = url;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
