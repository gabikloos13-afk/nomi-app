<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#344b5e">
  <meta name="description" content="Nomi – eure einfache Reise-, Pack- und Aufgaben-App.">
  <meta name="robots" content="noindex,nofollow">
  <title>Nomi</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260920-2">
  <link rel="icon" type="image/png" href="./nomi-192-v2.png">
  <link rel="apple-touch-icon" href="./nomi-192-v2.png">
  <style>
    :root{--navy:#344b5e;--warm:#f4f2ee;--muted:#6f7d84}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--warm)}
    body{overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:var(--warm)}
    iframe{display:block;width:100%;height:100%;border:0;background:var(--warm)}
    .loading,.error{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:28px;background:linear-gradient(180deg,#faf9f6,var(--warm));color:var(--navy);text-align:center}
    .card{width:min(100%,420px);border-radius:24px;padding:28px 22px;background:#fff;box-shadow:0 20px 60px rgba(52,75,94,.12)}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--navy);color:#fff;font-size:24px;font-weight:800}
    h1{margin:0;font-size:28px;letter-spacing:-.04em}p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:46px;margin-top:16px;border-radius:13px;padding:10px 16px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="shell">
    <div class="loading" id="loading"><div class="card"><div class="mark">N</div><h1>Nomi</h1><p>Deine Reise. Perfekt organisiert.</p></div></div>
    <div class="error" id="configError" hidden><div class="card"><div class="mark">!</div><h1>Nomi konnte nicht starten</h1><p>Die Verbindung zur Nomi-Datenbank konnte nicht geladen werden.</p><a id="directLink" href="https://script.google.com/macros/s/AKfycbxnaiV8o4t7skhkYp6iSNUQSWR_kMku5H2lBkLeXdGcvoORHmGnHgdY13Hwk8YNWiuR4A/exec">Nomi direkt öffnen</a></div></div>
    <iframe id="nomiFrame" title="Nomi" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <script src="./config.js?v=20260920-2"></script>
  <script>
    (function(){
      'use strict';
      var FALLBACK='https://script.google.com/macros/s/AKfycbxnaiV8o4t7skhkYp6iSNUQSWR_kMku5H2lBkLeXdGcvoORHmGnHgdY13Hwk8YNWiuR4A/exec';
      var frame=document.getElementById('nomiFrame');
      var loading=document.getElementById('loading');
      var error=document.getElementById('configError');
      var configured=window.NOMI_CONFIG&&(window.NOMI_CONFIG.APP_URL||window.NOMI_CONFIG.appUrl);
      var url=(configured||FALLBACK||'').trim();
      var valid=/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec(?:[?#].*)?$/i.test(url);
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register('./sw.js?v=20260920-2').then(function(r){r.update();}).catch(function(){});
      }
      if(!valid){loading.hidden=true;error.hidden=false;return;}
      document.getElementById('directLink').href=url;
      frame.addEventListener('load',function(){window.setTimeout(function(){loading.hidden=true;},120);});
      frame.src=url+(url.indexOf('?')>=0?'&':'?')+'nomiPwa=1&v=20260920-2';
      window.setTimeout(function(){
        if(!loading.hidden){loading.hidden=true;}
      },3000);
    })();
  </script>
</body>
</html>
