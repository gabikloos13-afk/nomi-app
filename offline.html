<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="theme-color" content="#314e68">
  <title>Nomi – Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f2ee;
      color: #344b5e;
      font-family: Inter, system-ui, sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 430px);
      border: 1px solid #dce3e6;
      border-radius: 24px;
      padding: 26px;
      background: #fff;
      box-shadow: 0 20px 55px rgba(52, 75, 94, 0.12);
    }
    img {
      width: 86px;
      height: 86px;
      border-radius: 24px;
    }
    h1 {
      margin: 17px 0 0;
      font-size: 27px;
      letter-spacing: -0.04em;
    }
    p {
      margin: 10px 0 0;
      color: #68747b;
      line-height: 1.55;
    }
  </style>
</head>
<body>
  <main>
    <img src="./icons/nomi-192.png" alt="">
    <h1>Nomi ist gerade offline</h1>
    <p>
      Die installierte App-Hülle ist verfügbar. Reise-, Aufgaben- und
      Packdaten werden jedoch aus Google Apps Script geladen und benötigen
      eine Internetverbindung.
    </p>
  </main>
</body>
</html>
